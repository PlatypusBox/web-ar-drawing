<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="mobile-web-app-capable" content="yes">
    <title>Magic Colouring Aquarium</title>
    <style>
      html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #0b2a4a; }
      #unity-canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; background: #0b2a4a; touch-action: none; }
      #loading { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
                 color: #dff3ff; font: 600 20px system-ui, sans-serif; gap: 16px; }
      #bar { width: min(320px, 70vw); height: 10px; border-radius: 6px; background: #ffffff25; overflow: hidden; }
      #fill { width: 0%; height: 100%; background: #5fd0ff; transition: width .15s; }
      #print { position: fixed; top: 8px; left: 8px; z-index: 5; font: 600 13px system-ui, sans-serif; }
      #print summary { list-style: none; cursor: pointer; padding: 8px 12px; border-radius: 8px; color: #fff;
                       background: #0b2a4acc; border: 1px solid #ffffff40; user-select: none; }
      #print summary::-webkit-details-marker { display: none; }
      #print .menu { margin-top: 6px; padding: 6px; border-radius: 8px; background: #0b2a4aee; border: 1px solid #ffffff40;
                     display: flex; flex-direction: column; gap: 4px; }
      #print a { color: #bfeaff; text-decoration: none; padding: 7px 10px; border-radius: 6px; }
      #print a:hover, #print a:focus { background: #ffffff22; }
    </style>
  </head>
  <body>
    <details id="print">
      <summary>Printable pages</summary>
      <div class="menu">
        <a href="StreamingAssets/templates/fish_template_1.png" download="fish_colouring_page_1.png">Fish 1 - striped</a>
        <a href="StreamingAssets/templates/fish_template_2.png" download="fish_colouring_page_2.png">Fish 2 - spotted</a>
        <a href="StreamingAssets/templates/fish_template_3.png" download="fish_colouring_page_3.png">Fish 3 - long</a>
        <span style="color:#ffffffaa;padding:4px 10px;font-weight:400">A4, print at 100%</span>
      </div>
    </details>
    <canvas id="unity-canvas" tabindex="-1"></canvas>
    <div id="loading"><div>Loading Magic Aquarium…</div><div id="bar"><div id="fill"></div></div></div>
    <script src="Build/WebGL.loader.js"></script>
    <script>
      window.__arStatus = "loading";
      createUnityInstance(document.querySelector("#unity-canvas"), {
        arguments: [],
        dataUrl: "Build/WebGL.data.unityweb",
        frameworkUrl: "Build/WebGL.framework.js.unityweb",
        codeUrl: "Build/WebGL.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "WebARDrawing",
        productName: "Magic Colouring Aquarium",
        productVersion: "1.0",
        devicePixelRatio: Math.min(window.devicePixelRatio || 1, 2),
      }, (p) => { document.getElementById("fill").style.width = (p * 100) + "%"; })
      .then((inst) => { window.unityInstance = inst; document.getElementById("loading").style.display = "none"; })
      .catch((m) => { document.getElementById("loading").textContent = "Failed to load: " + m; });
    </script>
  </body>
</html>
